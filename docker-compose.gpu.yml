# GPU override: `docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d`
# Without this file, Whisper runs on the CPU (set WHISPER_DEVICE=cpu in .env).
services:
  whisper:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
