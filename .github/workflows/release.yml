name: Release

# Release process: release-please maintains a release PR from the conventional
# commits on main. Merging that release PR (with PO approval, like every PR)
# produces a tag and a GitHub release with a changelog.
#
# When that release is created, `publish-images` builds the server and worker images from the
# tagged tree and pushes them to GHCR. Every other push to main stops after release-please, so
# only an actual release produces artifacts.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # "true" only on the run that merged the release PR; every other push to main leaves it
      # empty, which is what gates the publish job below.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  publish-images:
    name: Publish the ${{ matrix.image }} image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow-level one entirely: `packages: write` is what
      # lets GITHUB_TOKEN push to GHCR, and this job needs nothing else beyond reading the tree.
      contents: read
      packages: write
    strategy:
      # Both images share the base, deps and prod-deps stages, but building them as separate jobs
      # keeps the wall clock at one image and gives each its own cache scope — the same split the
      # CI workflow uses, so a release reuses the layers CI already built.
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: server/Dockerfile
          - image: worker
            dockerfile: worker/Dockerfile
          - image: client
            dockerfile: client/Dockerfile
          - image: init
            dockerfile: infra/init/Dockerfile
          - image: edge
            dockerfile: infra/edge/Dockerfile
          - image: prometheus
            dockerfile: infra/monitoring/prometheus.Dockerfile
          - image: alertmanager
            dockerfile: infra/monitoring/alertmanager.Dockerfile
          - image: grafana
            dockerfile: infra/monitoring/grafana.Dockerfile
          # Keycloak's own optimized build. It is published alongside the application images
          # because `start --optimized` refuses to run against the stock upstream image, and
          # the production compose file needs a pinned tag rather than a build context.
          - image: keycloak
            dockerfile: infra/keycloak/Dockerfile
    steps:
      # Explicitly the tagged commit, not the branch head: another merge to main between the
      # release commit and this job would otherwise be built under the release's version number.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # The version tag is what a deployment pins; `latest` exists for convenience and is
          # deliberately not what the production compose file references.
          # The registry path is lowercase because GHCR rejects uppercase in an image name, while
          # the GitHub organization is spelled with a capital letter.
          tags: |
            ghcr.io/jocur/quorum-${{ matrix.image }}:${{ needs.release-please.outputs.version }}
            ghcr.io/jocur/quorum-${{ matrix.image }}:latest
          # linux/amd64 only, which is what the runner builds natively. Adding arm64 means
          # emulation and a build measured in tens of minutes; there is no arm64 target yet.
          platforms: linux/amd64
          # Shared with the CI workflow, per image: the pull request that produced the release
          # commit has usually populated these scopes already.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Provenance and SBOM attestations, so a deployment can verify what an image was built
          # from. buildx attaches them to the pushed manifest.
          provenance: true
          sbom: true

  # Deployment artifacts. Not an archive: a deployment is one compose file plus a .env, so the
  # release carries exactly those, individually downloadable. Everything else a deployment used to
  # need — scripts, realm, edge and monitoring configuration — is baked into the images above.
  release-assets:
    name: Attach the compose files
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            docker-compose.release.yml \
            docker-compose.release-gpu.yml \
            .env.example \
            --clobber
