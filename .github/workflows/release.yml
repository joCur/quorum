name: Release

# Release-Prozess: release-please pflegt einen Release-PR aus den Conventional
# Commits auf main. Merge des Release-PRs (mit PO-Approval, wie jeder PR)
# erzeugt Tag + GitHub-Release mit Changelog.
#
# When that release is created, `publish-images` builds the server and worker images from the
# tagged tree and pushes them to GHCR. Every other push to main stops after release-please, so
# only an actual release produces artifacts.
#
# Nothing is published from a tree whose CI did not pass. `require-green-ci` below resolves the
# tag to its commit and refuses to let the publishing jobs start unless the CI workflow succeeded
# for that exact commit — not for "main, lately". This is the second half of a deliberate pair:
# branch protection is what stops a red commit from reaching main, and this gate is what stops a
# release from shipping if protection was ever bypassed, misconfigured or overridden by an admin.
#
# release-please itself stays ungated on purpose. It has to be able to open and update the release
# PR from whatever is on main, including while main is red — that PR is how the state is read and
# fixed. Only the publishing path waits for green.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # "true" only on the run that merged the release PR; every other push to main leaves it
      # empty, which is what gates the publish job below.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  # The gate. Everything that leaves the repository depends on this job, so a failure here is a
  # release that stops after the tag: no images, no assets, and a red job saying why.
  require-green-ci:
    name: Require green CI for the released commit
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # The CI workflow for the release commit starts from the same push as this workflow, so this
    # job usually waits for it. The limit is well above a normal CI run (a few minutes, the
    # end-to-end suite included) and exists so a stuck run fails the release instead of holding a
    # runner for six hours.
    timeout-minutes: 45
    permissions:
      # Reading workflow runs is all this needs; it never touches the tree or the release.
      contents: read
      actions: read
    steps:
      - name: Verify the CI workflow succeeded for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          # The tag, not the branch head: another merge to main between the release commit and
          # this job would otherwise let the release inherit a different commit's CI result. This
          # is the same commit `publish-images` and `release-assets` check out.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          echo "Released commit: $sha"

          # The CI workflow's runs for exactly that commit, newest last. Restricted to push
          # events, because that is what a commit on main produces; a pull request's run belongs
          # to a merge reference, which is a different tree.
          #
          # Only the two scalars are carried out of jq. Commit subjects reach this response and
          # re-parsing a JSON blob through a shell variable trips over the control characters
          # some of them contain.
          run=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push")]
                  | sort_by(.run_number) | last | select(. != null)
                  | "\(.id) \(.html_url)"')

          if [ -z "$run" ]; then
            echo "::error::No CI run exists for $sha. A missing result is not a passing one, so" \
              "this release does not publish. Run the CI workflow for that commit and re-run" \
              "this job."
            exit 1
          fi

          # The newest run wins: a re-run after a fixed infrastructure failure is the answer that
          # counts, and an older attempt for the same commit is history.
          id=${run%% *}
          echo "CI run: ${run#* }"

          # Blocks until that run finishes and exits non-zero unless it succeeded — so a CI run
          # still in flight is waited for rather than guessed at, and one that already failed
          # stops the release immediately. `-R` because this job checks out nothing, so there is
          # no repository for the CLI to infer.
          gh run watch "$id" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 >/dev/null

          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .conclusion)
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for $sha concluded '$conclusion'. Nothing is published from a tree" \
              "whose CI did not pass."
            exit 1
          fi
          echo "CI succeeded for $sha — the release may publish."

  publish-images:
    name: Publish the ${{ matrix.image }} image
    needs: [release-please, require-green-ci]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow-level one entirely: `packages: write` is what
      # lets GITHUB_TOKEN push to GHCR, and this job needs nothing else beyond reading the tree.
      contents: read
      packages: write
    strategy:
      # Both images share the base, deps and prod-deps stages, but building them as separate jobs
      # keeps the wall clock at one image and gives each its own cache scope — the same split the
      # CI workflow uses, so a release reuses the layers CI already built.
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: server/Dockerfile
          - image: worker
            dockerfile: worker/Dockerfile
          - image: client
            dockerfile: client/Dockerfile
          - image: init
            dockerfile: infra/init/Dockerfile
          - image: edge
            dockerfile: infra/edge/Dockerfile
          - image: prometheus
            dockerfile: infra/monitoring/prometheus.Dockerfile
          - image: alertmanager
            dockerfile: infra/monitoring/alertmanager.Dockerfile
          - image: grafana
            dockerfile: infra/monitoring/grafana.Dockerfile
          # Keycloak's own optimized build. It is published alongside the application images
          # because `start --optimized` refuses to run against the stock upstream image, and
          # the production compose file needs a pinned tag rather than a build context.
          - image: keycloak
            dockerfile: infra/keycloak/Dockerfile
    steps:
      # Explicitly the tagged commit, not the branch head: another merge to main between the
      # release commit and this job would otherwise be built under the release's version number.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # The version tag is what a deployment pins; `latest` exists for convenience and is
          # deliberately not what the production compose file references.
          # The registry path is lowercase because GHCR rejects uppercase in an image name, while
          # the GitHub organization is spelled with a capital letter.
          tags: |
            ghcr.io/jocur/quorum-${{ matrix.image }}:${{ needs.release-please.outputs.version }}
            ghcr.io/jocur/quorum-${{ matrix.image }}:latest
          # linux/amd64 only, which is what the runner builds natively. Adding arm64 means
          # emulation and a build measured in tens of minutes; there is no arm64 target yet.
          platforms: linux/amd64
          # Shared with the CI workflow, per image: the pull request that produced the release
          # commit has usually populated these scopes already.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Provenance and SBOM attestations, so a deployment can verify what an image was built
          # from. buildx attaches them to the pushed manifest.
          provenance: true
          sbom: true

  # Deployment artifacts. Not an archive: a deployment is one compose file plus a .env, so the
  # release carries exactly those, individually downloadable. Everything else a deployment used to
  # need — scripts, realm, edge and monitoring configuration — is baked into the images above.
  release-assets:
    name: Attach the compose files
    needs: [release-please, require-green-ci]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            docker-compose.release.yml \
            docker-compose.release-gpu.yml \
            .env.example \
            --clobber
