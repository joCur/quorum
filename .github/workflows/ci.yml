name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Typecheck · Tests · Build · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  e2e:
    name: E2E (critical paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect E2E suite
        id: e2e
        run: |
          if [ -d e2e ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.e2e.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Run E2E
        if: steps.e2e.outputs.present == 'true'
        run: |
          npm ci
          npm run e2e
