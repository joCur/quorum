name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Typecheck · Tests · Build · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

  e2e:
    name: E2E (critical paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect E2E suite
        id: e2e
        run: |
          if [ -d e2e ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.e2e.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.e2e.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Run E2E
        if: steps.e2e.outputs.present == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run e2e
