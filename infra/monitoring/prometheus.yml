# Prometheus for the opt-in `monitoring` compose profile.
#
# Both targets are addressed by their compose service name, so this file works unchanged in the
# development stack and on a self-hosted deployment that keeps the same names. Neither endpoint is
# published to a host port — Prometheus reaches them across the compose network.

global:
  # A stuck job is diagnosed in minutes, not seconds. A 15 s interval keeps the queue gauges
  # responsive enough to watch a backlog drain live without generating pointless samples.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: quorum

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Queue depth and backlog age live here: the API is the always-on process, so its gauges survive
  # exactly the worker outage the backlog alert exists to catch.
  - job_name: quorum-api
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: quorum-server

  # Job throughput, duration and failure outcomes.
  - job_name: quorum-worker
    static_configs:
      - targets: ["worker:9091"]
        labels:
          service: quorum-worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
