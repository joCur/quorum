# Quorum login theme.
#
# It inherits Keycloak's own v2 login theme rather than replacing it: every page of the
# authentication flow — password, OTP, reset, consent — keeps working, and the standard field
# names and ids (`username`, `password`, `kc-login`) stay exactly where they are, which is what
# the end-to-end suite signs in through. This theme adds a stylesheet and two message bundles on
# top; there is not a single template of ours in it.
#
# `styles` replaces the parent's list rather than extending it, so the parent's own stylesheet is
# named again here. It resolves through the theme hierarchy to Keycloak's file.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/quorum.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

# Dark mode is ours: the parent's toggle swaps PatternFly's palette on a class, while the Quorum
# tokens follow `prefers-color-scheme` in the stylesheet, in both themes' own colors.
darkMode=false

# The two languages the app itself speaks.
locales=en,de
