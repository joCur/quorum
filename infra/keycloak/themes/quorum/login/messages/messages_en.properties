# Quorum login theme — English overrides on top of Keycloak's own bundle.
#
# Only the few strings the design speaks differently are listed; everything else in the flow keeps
# Keycloak's wording, which is already translated into both languages.
#
# `loginTitleHtml` is the header above the login card, and it is deliberately empty: the Q mark and
# the wordmark are drawn by the stylesheet and already say who this is. An empty value also stops
# Keycloak falling back to the realm's display name, which would print a second "Quorum" directly
# under the wordmark.
loginTitleHtml=
doLogIn=Sign in
