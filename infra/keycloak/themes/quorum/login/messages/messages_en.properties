# Quorum login theme — English overrides on top of Keycloak's own bundle.
#
# Only the few strings the design speaks differently are listed; everything else in the flow keeps
# Keycloak's wording, which is already translated into both languages.
#
# `loginTitleHtml` is the header above the login card. It is deliberately plain text: the Q mark
# and the wordmark are drawn by the stylesheet (brand, not language), and this line is the part
# that has to be said in the reader's own words.
loginTitleHtml=Your meetings. Your data.
doLogIn=Sign in
