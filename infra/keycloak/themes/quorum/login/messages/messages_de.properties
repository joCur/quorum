# Quorum login theme — German overrides on top of Keycloak's own bundle.
#
# Keycloak reads message bundles as ISO-8859-1 unless the file is escaped, so non-ASCII characters
# are written as \uXXXX escapes rather than as literal umlauts.
loginTitleHtml=Deine Meetings. Deine Daten.
doLogIn=Anmelden
# Keycloak's German bundle addresses the user formally. The product says "du" everywhere else, and
# the sign-in page is not the one place to switch.
loginAccountTitle=Bei deinem Konto anmelden
