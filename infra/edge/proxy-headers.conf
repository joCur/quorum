# Headers the edge passes to every upstream.
#
# THE FORWARDED HEADERS ARE THE LOAD-BEARING ONES. Keycloak runs with KC_PROXY_HEADERS=xforwarded
# behind a realm that requires HTTPS, and it only ever sees plain HTTP. Whether a login works at
# all comes down to whether it is told the browser's request was secure. The honest value is the
# one the operator's TLS-terminating proxy sent; the `$quorum_forwarded_*` variables fall back to
# this hop's own values only when no outer proxy set them, which is a development shape rather
# than a deployment one.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $quorum_forwarded_proto;
proxy_set_header X-Forwarded-Host $quorum_forwarded_host;
proxy_set_header X-Forwarded-Port $quorum_forwarded_port;
