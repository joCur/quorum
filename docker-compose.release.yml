# Quorum — production stack, built from published release images.
#
# WHY THIS IS A SEPARATE FILE AND NOT AN OVERRIDE ON docker-compose.yml
# ---------------------------------------------------------------------------------------------
# Compose overrides can add and replace, but they cannot remove. `ports` and `volumes` entries
# from the base file are appended to, never dropped, so an override physically cannot take away
# the published MinIO console port or the mount that imports the development realm — the two
# things a production stack most needs gone. `build:` is likewise sticky. A standalone file is
# the only construction where "the development realm is not imported here" is a fact about the
# file rather than a claim about merge semantics.
#
# The cost is duplication: a service added to docker-compose.yml has to be added here too. That
# is a visible, reviewable cost, and it is the cheaper of the two.
#
# HOW TO RUN IT
# ---------------------------------------------------------------------------------------------
#   docker compose -f docker-compose.release.yml up -d
#   docker compose -f docker-compose.release.yml -f docker-compose.gpu.yml up -d   # with a GPU
#
# It reads the .env file next to it. `docs/deployment.md` walks a fresh host through it end to
# end and lists the mandatory values; the `preflight` service refuses to start the stack while
# any of them is missing or still holds a placeholder.
#
# WHAT THIS FILE ASSUMES
# ---------------------------------------------------------------------------------------------
# A TLS-terminating reverse proxy on the host, in front of the API and Keycloak. Nothing here
# speaks HTTPS: the API and Keycloak listen on plain HTTP bound to ${BIND_ADDRESS}, which
# defaults to loopback, so they are unreachable from outside the host without that proxy.

name: quorum

services:
  # ---------------------------------------------------------------------------------------------
  # Preflights — one-shot gates that run before anything else and stop the stack on a
  # misconfiguration, rather than letting it come up in a state nobody intended.
  # ---------------------------------------------------------------------------------------------

  # Mandatory values present, long enough, and not the placeholders from .env.example.
  preflight:
    image: alpine:3.22
    environment:
      QUORUM_VERSION: ${QUORUM_VERSION:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-}
      QUORUM_PUBLIC_URL: ${QUORUM_PUBLIC_URL:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      SUMMARY_BASE_URL: ${SUMMARY_BASE_URL:-}
      SUMMARY_API_KEY: ${SUMMARY_API_KEY:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-}
    volumes:
      - ./scripts/secrets-preflight.sh:/usr/local/bin/secrets-preflight.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/secrets-preflight.sh"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Format check on the MinIO KMS master key — see the script for why it cannot live in
  # minio-init. Same script as the development stack.
  kms-preflight:
    image: alpine:3.22
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    volumes:
      - ./scripts/kms-preflight.sh:/usr/local/bin/kms-preflight.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/kms-preflight.sh"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # ---------------------------------------------------------------------------------------------
  # Application — the two images this repository publishes on release.
  # ---------------------------------------------------------------------------------------------

  api:
    # Pinned to the release version, never to `latest`: `docker compose pull` on a floating tag
    # changes what is running without anyone deciding to. The preflight refuses an unset version.
    image: ${QUORUM_IMAGE_REGISTRY:-ghcr.io/jocur}/quorum-server:${QUORUM_VERSION}
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_SSE: ${S3_SSE:-AES256}
      # Header authentication is a development shortcut past the token check. It has no default
      # here and no variable: in this file it is off, full stop.
      RECORDING_ALLOW_HEADER_AUTH: "false"
      RECORDING_MAX_RECORDED_SECONDS: ${RECORDING_MAX_RECORDED_SECONDS:-14400}
      RECORDING_MAX_SESSION_LIFETIME_SECONDS: ${RECORDING_MAX_SESSION_LIFETIME_SECONDS:-43200}
      RECORDING_MAX_PAUSE_SECONDS: ${RECORDING_MAX_PAUSE_SECONDS:-7200}
      RECORDING_MAX_PARALLEL_SESSIONS: ${RECORDING_MAX_PARALLEL_SESSIONS:-3}
      RECORDING_MAX_CHUNKS_PER_SECOND: ${RECORDING_MAX_CHUNKS_PER_SECOND:-20}
      RECORDING_MAX_BYTES_PER_SECOND: ${RECORDING_MAX_BYTES_PER_SECOND:-4194304}
      RECORDING_RATE_BURST_SECONDS: ${RECORDING_RATE_BURST_SECONDS:-10}
      QUOTA_STORAGE_BYTES: ${QUOTA_STORAGE_BYTES:-53687091200}
      QUOTA_MONTHLY_RECORDED_SECONDS: ${QUOTA_MONTHLY_RECORDED_SECONDS:-360000}
      QUOTA_USAGE_FLUSH_CHUNKS: ${QUOTA_USAGE_FLUSH_CHUNKS:-64}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
      API_RATE_LIMIT_SUMMARY_MAX: ${API_RATE_LIMIT_SUMMARY_MAX:-10}
      # Discovery and JWKS over the compose network; the public issuer is what browser-obtained
      # tokens actually carry, and both are accepted as `iss` (ADR-006 §7).
      OIDC_ISSUER_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-quorum}
      OIDC_PUBLIC_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM:-quorum}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-quorum-pwa}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-quorum-api}
      OIDC_TENANT_CLAIM: ${OIDC_TENANT_CLAIM:-tenant_id}
    # No host port. The client container is the single entry point and reaches the API over the
    # Compose network; publishing a second door would only be a way around the one front door.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      # Not just "Keycloak is up" but "the realm is the one this release expects" — the API
      # validates tokens against it, so starting before it is applied means rejecting logins.
      keycloak-config:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # The image already runs as the unprivileged `node` user and writes nothing to disk, so the
    # full set applies: no writable root filesystem, no capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      # Node itself never needs this, but a diagnostic tool run with `docker exec` does, and an
      # empty in-memory /tmp costs nothing.
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          # Sized for a single-host deployment: enough that a burst of concurrent recordings is
          # not throttled, low enough that a leak takes down one container rather than the host.
          cpus: "${API_CPU_LIMIT:-2}"
          memory: ${API_MEMORY_LIMIT:-1g}
    logging: &logging
      driver: json-file
      options:
        # Without a cap, a chatty container fills the disk and takes the database with it.
        max-size: "20m"
        max-file: "5"

  worker:
    image: ${QUORUM_IMAGE_REGISTRY:-ghcr.io/jocur}/quorum-worker:${QUORUM_VERSION}
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_SSE: ${S3_SSE:-AES256}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://whisper:8000/v1}
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      SUMMARY_BASE_URL: ${SUMMARY_BASE_URL}
      SUMMARY_API_KEY: ${SUMMARY_API_KEY}
      SUMMARY_MODEL: ${SUMMARY_MODEL}
      # Prometheus exposition plus the liveness probe below. No host port: the monitoring
      # profile scrapes it by service name over the compose network.
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9091}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak-config:
        condition: service_completed_successfully
      whisper:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.WORKER_METRICS_PORT||9091)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-2}"
          # Transcript and summary payloads are held in memory while a job runs; a long meeting
          # is the sizing case.
          memory: ${WORKER_MEMORY_LIMIT:-2g}
    logging: *logging

  # ---------------------------------------------------------------------------------------------
  # The edge proxy — the single front door, and the ONLY service published to the host.
  #
  # It puts the app, the API and Keycloak on one origin: / to the client, /api, /ws and /healthz
  # to the API, /realms and the other browser-facing Keycloak paths to Keycloak. That is the shape
  # the app is built for (empty API base URL, same-origin issuer), and it reduces the operator's
  # reverse proxy to TLS plus one upstream, with no routing table to reproduce.
  #
  # A stock nginx image with a mounted config rather than an image of our own: there is nothing to
  # compile, so there is no reason to publish a fourth artifact. The config is versioned in this
  # repository and ships in the deployment bundle alongside this file.
  #
  # TLS is NOT here. Certificates and their renewal are the operator's concern, terminated in
  # front of this. docs/deployment.md gives the one-liner for nginx and for Caddy.
  # ---------------------------------------------------------------------------------------------
  edge:
    image: nginxinc/nginx-unprivileged:${NGINX_VERSION:-1.29-alpine}
    restart: unless-stopped
    environment:
      QUORUM_CLIENT_UPSTREAM: client:8080
      QUORUM_API_UPSTREAM: api:8080
      QUORUM_KEYCLOAK_UPSTREAM: keycloak:8080
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./infra/edge/nginx.conf.template:/etc/nginx/templates/quorum.conf.template:ro
      - ./infra/edge/proxy-headers.conf:/etc/nginx/quorum-proxy-headers.conf:ro
    ports:
      # The one published port in the whole stack. Loopback by default, because the operator's
      # TLS-terminating proxy runs on the host; BIND_ADDRESS=0.0.0.0 publishes plain HTTP to the
      # network, which is only correct when the TLS proxy is on a different machine.
      - "${BIND_ADDRESS:-127.0.0.1}:${EDGE_PORT:-8080}:8080"
    depends_on:
      client:
        condition: service_healthy
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/healthz/edge || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      # nginx's pid file and proxy buffers, plus the directory the base image renders the config
      # template into at start. All per-container runtime state.
      #
      # mode=1777 on all three is load-bearing: a tmpfs is created root-owned, this container runs
      # unprivileged, and the entrypoint's envsubst step FAILS SOFTLY when it cannot write to
      # conf.d — nginx then starts on the image's stock default config and serves the wrong site
      # while still looking healthy to Docker.
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
      - /etc/nginx/conf.d:size=1m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "${EDGE_CPU_LIMIT:-1}"
          memory: ${EDGE_MEMORY_LIMIT:-128m}
    logging: *logging

  # ---------------------------------------------------------------------------------------------
  # The browser app. Static files behind an unprivileged nginx, and nothing else: this image names
  # no other service and runs standalone. The stack's routing lives in the edge proxy above.
  # ---------------------------------------------------------------------------------------------
  client:
    image: ${QUORUM_IMAGE_REGISTRY:-ghcr.io/jocur}/quorum-client:${QUORUM_VERSION}
    restart: unless-stopped
    # No host port: the edge is the only way in.
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/healthz/client || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      # nginx writes its pid and its request temp files here. mode=1777 because a tmpfs is created
      # root-owned, and this container runs unprivileged — without it nginx cannot write at all.
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "${CLIENT_CPU_LIMIT:-1}"
          memory: ${CLIENT_MEMORY_LIMIT:-128m}
    logging: *logging

  # ---------------------------------------------------------------------------------------------
  # Auth — Keycloak, production configuration.
  #
  # Differences from the development service, all of them deliberate:
  #   * the optimized image built from infra/keycloak/Dockerfile, started with
  #     `start --optimized` instead of `start-dev`;
  #   * no realm import and no mount of infra/keycloak/realm-quorum.json — that realm is a
  #     development fixture with `sslRequired: none`, a password-grant client and known test
  #     users. docs/deployment.md describes how the production realm is created instead;
  #   * hostname checks on, `KC_HTTP_ENABLED` still true because TLS is terminated in the reverse
  #     proxy, with `KC_PROXY_HEADERS=xforwarded` so Keycloak sees the real scheme and client
  #     address. That combination is what makes `sslRequired: external` behave correctly.
  # ---------------------------------------------------------------------------------------------
  keycloak:
    image: ${QUORUM_IMAGE_REGISTRY:-ghcr.io/jocur}/quorum-keycloak:${QUORUM_VERSION}
    restart: unless-stopped
    command: ["start", "--optimized"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
      # Plain HTTP inside the stack, HTTPS at the proxy. Keycloak has to be told that, or every
      # redirect it issues points at http:// and `sslRequired: external` rejects the request it
      # just redirected.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      # On, unlike development: the hostname is known here, and the check is what stops a Host
      # header from redirecting a login somewhere else.
      KC_HOSTNAME_STRICT: "true"
    depends_on:
      preflight:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # No host port either: the login pages and the admin console are reached through the client
    # container, on the same origin as the app, which is what lets the browser treat the issuer
    # as same-origin and what keeps the operator's proxy down to one upstream.
    healthcheck:
      # The image ships neither curl nor wget, but /bin/sh is bash, so /dev/tcp works. Since
      # Keycloak 25 the health endpoints live on the management port 9000.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    # HARDENING EXCEPTION — deliberately not read_only, and the honest reason is not "it does not
    # start". It starts: it logs three ARJUNA048006 warnings and then runs without a transaction
    # recovery store, because Narayana cannot create its object store on a read-only root
    # filesystem. That trades a degraded database-transaction recovery path for a hardening flag,
    # and putting the store on a tmpfs would be worse — recovery data that vanishes on exactly
    # the restart it exists to survive. The capability drop and the escalation block still apply.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "${KEYCLOAK_CPU_LIMIT:-2}"
          # A JVM under a hard memory limit is killed rather than throttled, so this sits well
          # above the heap Keycloak actually uses at this scale.
          memory: ${KEYCLOAK_MEMORY_LIMIT:-1g}
    logging: *logging

  # One-shot realm configuration, applied on every deploy the way a database migration is.
  #
  # infra/keycloak/realm-production.json is the source of truth for what the realm contains, and
  # this service makes the running Keycloak match it. Two consequences, both deliberate:
  #
  #   * A realm change is a pull request against that file, reviewed as a diff. There is no step
  #     where someone clicks it into a running instance and nobody else finds out.
  #   * Configuration drift is REVERTED, not merged. A setting changed by hand in the admin
  #     console lasts until the next deploy. That is the feature: the file describes the realm,
  #     so the file wins.
  #
  # Running it every time rather than once is what makes it idempotent — it computes the
  # difference against the live realm, so a second run with an unchanged file is a no-op.
  keycloak-config:
    # Pinned to a build of keycloak-config-cli made for our Keycloak version. The tag carries
    # both: <config-cli version>-<keycloak version>. These two are upgraded together — bumping
    # KEYCLOAK_VERSION without bumping this tag pairs the tool with an admin API it was not built
    # against. docs/deployment.md says the same thing next to the upgrade procedure.
    image: adorsys/keycloak-config-cli:${KEYCLOAK_CONFIG_CLI_VERSION:-6.5.1-26.5.5}
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      # Over the Compose network, so the admin API is never exposed to do this.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/realm-production.json
      # Lets the realm file carry $(env:QUORUM_PUBLIC_URL) instead of a hard-coded origin, so one
      # committed file serves every deployment.
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      QUORUM_PUBLIC_URL: ${QUORUM_PUBLIC_URL}
      # WITHOUT THIS, DRIFT IS NOT REVERTED. By default the tool stores a checksum of the file it
      # imported and skips the whole run when the file has not changed — which is fine for
      # applying new configuration and useless for the property we actually want, because a
      # setting changed by hand in the admin console lives on untouched until someone happens to
      # edit the file. Turning the cache off makes every deploy a real reconciliation. Measured
      # cost: a skipped run takes ~0.5s, a real one ~3s.
      IMPORT_CACHE_ENABLED: "false"
      # THE ONE EXCEPTION TO "the file wins": users are runtime data, not configuration. Under the
      # default (`full`) this tool deletes every realm object absent from the file — which for
      # users would mean wiping every account the deployment has ever created, on every deploy.
      IMPORT_MANAGED_USER: no-delete
    volumes:
      - ./infra/keycloak/realm-production.json:/config/realm-production.json:ro
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # ---------------------------------------------------------------------------------------------
  # Data — never published on a host port. The only way in is the compose network.
  # ---------------------------------------------------------------------------------------------

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
    depends_on:
      preflight:
        condition: service_completed_successfully
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory only: provisions Keycloak's database and role.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      # The two paths Postgres writes outside its data volume: the Unix socket and lock file, and
      # the scratch space initdb uses on first start. Both are per-container runtime state, so a
      # tmpfs is the right home for them — nothing here needs to survive a restart.
      - /var/run/postgresql:size=8m
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    # What the entrypoint needs to fix ownership of the data directory and step down from root to
    # the postgres user. Without them the container never starts.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-2}"
          memory: ${POSTGRES_MEMORY_LIMIT:-2g}
    logging: *logging

  minio:
    image: minio/minio:${MINIO_VERSION:-latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Built-in KMS with a static key — what lets the bucket enforce default server-side
      # encryption (ADR-001). Losing this key makes the stored audio unreadable; the backup
      # procedure for it is in docs/runbooks/backup-restore.md.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
      # No browser console in a deployment: the S3 API is all this stack uses, and the console is
      # a second authenticated surface with root credentials behind it.
      MINIO_BROWSER: "off"
    depends_on:
      kms-preflight:
        condition: service_completed_successfully
    volumes:
      - minio-data:/data
    # No ports at all — neither the S3 API nor the console. The API and the worker reach MinIO
    # over the compose network by service name.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "${MINIO_CPU_LIMIT:-2}"
          memory: ${MINIO_MEMORY_LIMIT:-2g}
    logging: *logging

  # One-shot bucket bootstrap: creates the recordings bucket and turns on default server-side
  # encryption, so an object cannot be written unencrypted even if a client forgets to ask.
  minio-init:
    image: minio/mc:${MINIO_MC_VERSION:-latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      # `mc alias set` writes a config file under $HOME by default, which a read-only root
      # filesystem refuses. Pointing it at the tmpfs below is what makes read_only possible here.
      MC_CONFIG_DIR: /tmp/mc
    volumes:
      - ./scripts/minio-init.sh:/usr/local/bin/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-init.sh"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # ---------------------------------------------------------------------------------------------
  # Transcription — a third-party image, pinned by tag. Layer docker-compose.gpu.yml on top to
  # give it a GPU; without that it runs on the CPU (set WHISPER_DEVICE=cpu and a CPU image tag).
  # ---------------------------------------------------------------------------------------------
  whisper:
    image: ghcr.io/speaches-ai/speaches:${WHISPER_IMAGE_TAG:-latest-cuda}
    restart: unless-stopped
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL}
      WHISPER__COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE}
      WHISPER__DEVICE: ${WHISPER_DEVICE}
    volumes:
      # Model cache across restarts. Without it every restart re-downloads several gigabytes.
      - whisper-models:/home/ubuntu/.cache/huggingface
    # No ports: only the worker talks to it, over the compose network.
    #
    # No hardening block. This is somebody else's image: it downloads models at runtime, and the
    # CUDA variant needs device access that a blanket capability drop interferes with. Treated as
    # untrusted-but-necessary, it holds no credentials and no recordings — the audio it receives
    # is passed in per request, and it has no route to the object store or the database.
    deploy:
      resources:
        limits:
          cpus: "${WHISPER_CPU_LIMIT:-4}"
          memory: ${WHISPER_MEMORY_LIMIT:-8g}
    logging: *logging

  # ---------------------------------------------------------------------------------------------
  # Monitoring — OPT-IN, exactly as in the development stack:
  #
  #   docker compose -f docker-compose.release.yml --profile monitoring up -d
  #
  # Behind a profile because the pipeline must not depend on it: if Prometheus being down could
  # stop a recording, the monitoring would be the outage. docs/runbooks/pipeline.md has a
  # response for every alert these three raise.
  # ---------------------------------------------------------------------------------------------

  # The monitoring profile's own gate — same script, called with the one variable it has to
  # enforce. It lives here rather than in the main preflight so that it only applies when the
  # profile is active.
  monitoring-preflight:
    image: alpine:3.22
    profiles: ["monitoring"]
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - ./scripts/secrets-preflight.sh:/usr/local/bin/secrets-preflight.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/secrets-preflight.sh", "GRAFANA_ADMIN_PASSWORD"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.7.3}
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # `--web.enable-lifecycle` is deliberately absent, unlike the development stack: it exposes
    # an unauthenticated endpoint that reloads or shuts down Prometheus.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-1}"
          memory: ${PROMETHEUS_MEMORY_LIMIT:-1g}
    logging: *logging

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.28.1}
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "${ALERTMANAGER_CPU_LIMIT:-1}"
          memory: ${ALERTMANAGER_MEMORY_LIMIT:-512m}
    logging: *logging

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.3.1}
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # No default, unlike the development stack: an admin console reachable with admin/admin is
      # exactly the kind of thing that survives into production unnoticed. The value is enforced
      # by monitoring-preflight rather than by a `:?` here, because Compose interpolates every
      # service in the file regardless of profile — a required variable at this spot would stop
      # a stack that never enables monitoring from starting at all.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # Data sources and dashboards come from this repository, not from clicks in the UI.
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      monitoring-preflight:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-1}"
          memory: ${GRAFANA_MEMORY_LIMIT:-512m}
    logging: *logging

volumes:
  pg-data:
  minio-data:
  whisper-models:
  prometheus-data:
  alertmanager-data:
  grafana-data:
