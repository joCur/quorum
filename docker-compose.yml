# Quorum — Self-Hosting-Skeleton (Docker Compose)
# Whisper-Modell, GPU-Nutzung und Summary-Backend sind reine Env-Konfiguration (.env):
#   Entwicklung (GTX 1050):  WHISPER_MODEL=small, INT8
#   Nach GPU-Upgrade:        WHISPER_MODEL=large-v3, FP16 — Rest unverändert
#   CPU-Fallback:            Compose ohne GPU-Override starten (siehe unten)

name: quorum

services:
  api:
    # @quorum/server — Fastify REST plus the WebSocket recording endpoint (ADR-002). The build
    # context is the repository root, because the server consumes the @quorum/shared workspace
    # and the root pnpm lockfile.
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Server-side encryption requested per object; the bucket additionally
      # carries default SSE via the minio-init service (ADR-001).
      S3_SSE: ${S3_SSE:-AES256}
      RECORDING_ALLOW_HEADER_AUTH: ${RECORDING_ALLOW_HEADER_AUTH:-false}
      # Abuse and cost protection for the recording endpoint. Each value has a default far above
      # what a real meeting does; `server/README.md` says what each one bounds and why.
      RECORDING_MAX_RECORDED_SECONDS: ${RECORDING_MAX_RECORDED_SECONDS:-14400}
      RECORDING_MAX_SESSION_LIFETIME_SECONDS: ${RECORDING_MAX_SESSION_LIFETIME_SECONDS:-43200}
      RECORDING_MAX_PAUSE_SECONDS: ${RECORDING_MAX_PAUSE_SECONDS:-7200}
      RECORDING_MAX_PARALLEL_SESSIONS: ${RECORDING_MAX_PARALLEL_SESSIONS:-3}
      RECORDING_MAX_CHUNKS_PER_SECOND: ${RECORDING_MAX_CHUNKS_PER_SECOND:-20}
      RECORDING_MAX_BYTES_PER_SECOND: ${RECORDING_MAX_BYTES_PER_SECOND:-4194304}
      RECORDING_RATE_BURST_SECONDS: ${RECORDING_RATE_BURST_SECONDS:-10}
      QUOTA_STORAGE_BYTES: ${QUOTA_STORAGE_BYTES:-53687091200}
      QUOTA_MONTHLY_RECORDED_SECONDS: ${QUOTA_MONTHLY_RECORDED_SECONDS:-360000}
      QUOTA_USAGE_FLUSH_CHUNKS: ${QUOTA_USAGE_FLUSH_CHUNKS:-64}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
      API_RATE_LIMIT_SUMMARY_MAX: ${API_RATE_LIMIT_SUMMARY_MAX:-10}
      # Internal issuer — used for discovery and JWKS fetching from inside the compose network.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://keycloak:8080/realms/quorum}
      # Public issuer — the value that ends up in the `iss` claim of browser-obtained tokens,
      # because the container hostname is not resolvable from the client (ADR-006 §7).
      OIDC_PUBLIC_ISSUER_URL: ${OIDC_PUBLIC_ISSUER_URL:-http://localhost:8081/realms/quorum}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-quorum-pwa}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-quorum-api}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  keycloak:
    # Auth provider inside the stack, configured as code (ADR-006 §7).
    # DEV:  `start-dev --import-realm` — plain HTTP, relaxed hostname checks, realm imported on
    #       first start so a fresh checkout plus `docker compose up` yields a working login.
    # PROD: build an optimized image and run `start --optimized --import-realm` instead, with
    #       KC_HOSTNAME set to the public HTTPS origin, KC_HTTP_ENABLED=false (or TLS terminated
    #       in the reverse proxy plus KC_PROXY_HEADERS=xforwarded), a real admin password, and the
    #       dev clients/users removed from the realm JSON — see infra/keycloak/README.md.
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.5}
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      # Own logical database on the shared Postgres — no second database container (ADR-006 §7).
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Issuer origin as browsers see it; the API validates that issuer as well.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./infra/keycloak/realm-quorum.json:/opt/keycloak/data/import/realm-quorum.json:ro
    ports:
      # Local development only — put the admin console behind the reverse proxy in production.
      - "${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      # The image ships neither curl nor wget, but /bin/sh is bash, so /dev/tcp works.
      # Since Keycloak 25 the health endpoints live on the management port 9000.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      # Keycloak sends verification and password-reset mail over SMTP the moment a user asks for
      # one. Starting the relay first is what makes the very first reset in a fresh checkout work
      # instead of failing with a connection error.
      mailpit:
        condition: service_healthy

  mailpit:
    # The development mail relay. The development realm points its SMTP settings at this
    # container, so password reset and address verification are walkable end to end on a laptop:
    # nothing is delivered anywhere, every message lands in the web inbox on MAILPIT_UI_PORT.
    #
    # It exists so those flows can be TESTED and not merely configured. A verification mail that is
    # only ever exercised against a real relay is a flow nobody walks through until a user does.
    #
    # DEVELOPMENT ONLY. It accepts every message and shows it to anyone who can reach the port. The
    # production stack has no mail container at all — it talks to the operator's own relay.
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.27}
    restart: unless-stopped
    environment:
      # Nothing here is worth keeping across a restart, so the store stays in memory and the
      # container stays stateless — no volume to remember to empty.
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
    ports:
      # The web inbox, and the same origin the end-to-end suite reads messages from over the HTTP
      # API. SMTP stays internal — Keycloak is the only thing that sends to it.
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    # @quorum/worker — the queue consumer: transcribe -> Whisper, then summarize -> an
    # OpenAI-compatible chat API (ADR-005). Like the API, it is built from the repository root,
    # because it consumes the @quorum/shared workspace and the root pnpm lockfile.
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Whisper: the internal OpenAI-compatible endpoint (speaches).
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://whisper:8000/v1}
      WHISPER_MODEL: ${WHISPER_MODEL}
      # Unset means "let the model detect the language", which is what mixed-language
      # meetings want.
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      # Summary: OpenAI-compatible — OpenRouter today, LM Studio/vLLM/Ollama tomorrow (ADR-005).
      SUMMARY_BASE_URL: ${SUMMARY_BASE_URL}
      SUMMARY_API_KEY: ${SUMMARY_API_KEY}
      SUMMARY_MODEL: ${SUMMARY_MODEL}
      # Prometheus exposition and a liveness probe. Stays on the compose network — the
      # monitoring profile scrapes it by service name, so there is no host port to publish.
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9091}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The recordings bucket has to exist before the first job reads its chunks.
      minio-init:
        condition: service_completed_successfully
      whisper:
        condition: service_started
    healthcheck:
      # Until the worker had an HTTP surface, a wedged consumer still looked healthy to Docker
      # because nothing could ask it anything.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.WORKER_METRICS_PORT||9091)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  whisper:
    # speaches (ehem. faster-whisper-server): OpenAI-kompatible /v1/audio/transcriptions
    # Image-Tag bewusst pinnen — bei Pascal-GPUs (GTX 1050, CC 6.1) auf CUDA-Kompatibilität achten,
    # ggf. ältere Version wählen oder das *-cpu Image nutzen.
    image: ghcr.io/speaches-ai/speaches:${WHISPER_IMAGE_TAG:-latest-cuda}
    restart: unless-stopped
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL}
      WHISPER__COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE}   # int8 (1050) | float16 (4070 Ti S)
      WHISPER__DEVICE: ${WHISPER_DEVICE}               # cuda | cpu
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface  # Modell-Cache über Neustarts
    # GPU-Zugriff: aktiv via `docker compose -f docker-compose.yml -f docker-compose.gpu.yml up`
    # Host-Voraussetzung: NVIDIA-Treiber + nvidia-container-toolkit

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by the init script that provisions Keycloak's own database and role.
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory only (see the script for the retrofit note).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Built-in KMS with a static key — required for default bucket encryption
      # (ADR-001). Format: <key-name>:<base64 32 bytes>. SSE-KMS via KES is an
      # infra ticket; losing this key makes the stored audio unreadable.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    depends_on:
      # A malformed key kills MinIO with a message that never names the variable, and everything
      # else waits on a healthy MinIO — so the whole stack fails behind one unreadable error.
      kms-preflight:
        condition: service_completed_successfully
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Admin-Konsole; API bleibt intern
    healthcheck:
      # Without this the one-shot bucket bootstrap races MinIO's startup and fails, which then
      # blocks `api` (it waits for that bootstrap to complete successfully).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-shot format check on the KMS master key, before MinIO gets a chance to die of it.
  # Validates the shape only — nothing at startup can tell a well-formed WRONG key from the right
  # one, which is why the key backup procedure in docs/runbooks/backup-restore.md is not optional.
  kms-preflight:
    image: alpine:3.22
    environment:
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    volumes:
      - ./scripts/kms-preflight.sh:/usr/local/bin/kms-preflight.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/kms-preflight.sh"]
    restart: "no"

  # One-shot bucket bootstrap: creates the recordings bucket and turns on default
  # server-side encryption so nothing can be stored unencrypted (ADR-001).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./scripts/minio-init.sh:/usr/local/bin/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-init.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------------------------
  # Monitoring — OPT-IN. None of the three services below start with a plain `docker compose up`.
  #
  #   docker compose --profile monitoring up -d
  #
  # They are behind a profile because a developer running the stack to work on a feature should not
  # pay for three extra containers, and because the pipeline must not depend on them: if Prometheus
  # being down could stop a recording, the monitoring would be the outage.
  # See docs/runbooks/pipeline.md for what to do when one of these alerts fires.
  # ---------------------------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.7.3}
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Long enough to look back over a bad week; short enough that the volume stays small on a
      # single-host deployment. Metrics are operational data, not records worth keeping.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      # Local inspection only — behind the reverse proxy or Tailscale in production.
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.28.1}
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.3.1}
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Nothing here is public, and there is no sign-up flow to expose.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # Data sources and dashboards come from this repository, not from clicks in the UI: a
      # dashboard edited in the browser is lost the moment the container is recreated.
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pg-data:
  minio-data:
  whisper-models:
  prometheus-data:
  alertmanager-data:
  grafana-data:

# Hinweise:
# - Queue: pg-boss in Postgres — kein separater Redis nötig (siehe OPEN-QUESTIONS.md).
# - Reverse Proxy (Caddy/Traefik) mit TLS davor schalten, sobald von außen erreichbar;
#   für die private Phase reicht Tailscale.
# - Backups: pg_dump + MinIO-Bucket-Sync regelmäßig auf externes Ziel (ADR-001-Pflicht).
#   Schedule, retention, the deletion window and the KMS key handling are written up in
#   docs/runbooks/backup-restore.md.
