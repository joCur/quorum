# Compose override for the end-to-end suite.
#
# It changes four things about the base stack and nothing else:
#
# 1. Postgres, the MinIO S3 API and Whisper are published on the host, because the test process,
#    the storage assertions and the transcription worker all run on the host.
# 2. Whisper is pinned to the CPU image, so the suite runs on any machine and in CI.
# 3. Every published port has its own default (see e2e/e2e.env), so an e2e run can happen next to
#    a development stack without fighting it for ports.
# 4. The general API rate limit is raised, because the whole suite drives one user through a
#    complete meeting lifecycle — recording, polling, listing, deleting — in a couple of minutes,
#    far faster than a person ever would. That production default is sized for a human, so the
#    suite states its own number rather than pulling the real one up to meet it. The limit is still
#    on: a change that refuses a request outright still fails the suite.
#
#    The allowance for asking for a summary again is deliberately NOT raised. It is the one limit a
#    user meets in ordinary use, it is the one that has been rendered wrongly before, and a suite
#    that ran with a thousand of them could never have caught that. Nothing here needs more than a
#    couple: only two specs regenerate at all, and the self-polling that follows a regenerate reads
#    rather than posts, so it is metered against the general allowance above. Leaving this at the
#    shipped number is what lets the limits spec provoke the real refusal against the real value.
#
# Never use this override in a deployment.
services:
  api:
    environment:
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-10000}

  postgres:
    ports:
      - "${POSTGRES_PORT:-55433}:5432"

  minio:
    ports:
      - "${MINIO_PORT:-9010}:9000"

  whisper:
    # CPU image plus the smallest usable model — the real-Whisper variant has to stay feasible on
    # a laptop and on a CI runner without a GPU.
    image: ghcr.io/speaches-ai/speaches:${WHISPER_IMAGE_TAG:-latest-cpu}
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-tiny}
      WHISPER__COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER__DEVICE: ${WHISPER_DEVICE:-cpu}
    ports:
      - "${WHISPER_PORT:-8100}:8000"
