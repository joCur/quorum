# Nginx configuration for the Quorum client image.
#
# This serves the built PWA and nothing else. It does not proxy, it does not know that an API or
# an identity provider exist, and it names no other service — so the image runs anywhere, on its
# own, with no companions. Putting the stack's routing table in here was tried and rejected: an
# `upstream api:8080` that cannot be resolved stops nginx from starting at all, so a client image
# that carried the topology would refuse to run outside the full compose stack.
#
# Unifying the app, the API and Keycloak onto one origin is the edge proxy's job instead — see
# infra/edge/nginx.conf.template.
#
# Baked into the image as the server config, NOT shipped as an envsubst template: it has no
# variables to substitute, and a template would force /etc/nginx/conf.d to be writable at runtime
# on an otherwise read-only container for no gain.

server {
    # 8080, not 80: this image runs unprivileged and cannot bind a low port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Liveness for the container healthcheck. Deliberately not /healthz: that path belongs to the
    # API, and the edge routes it there.
    location = /healthz/client {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker and the manifest must never be served stale, or a released version can
    # take a long time to reach a browser that already has the old one.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Single-page app: unknown paths are client-side routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
